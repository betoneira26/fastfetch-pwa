<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="32" y="32" width="448" height="448" rx="88" fill="none" stroke="#313244" stroke-width="4" />
  <!-- Terminal title bar dots -->
  <circle cx="88" cy="88" r="14" fill="#f38ba8" />
  <circle cx="128" cy="88" r="14" fill="#f9e2af" />
  <circle cx="168" cy="88" r="14" fill="#a6e3a1" />
  <!-- Terminal prompt symbol >_ -->
  <path d="M120 180 L220 260 L120 340" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="260" y1="340" x2="380" y2="340" stroke="#a6e3a1" stroke-width="26" stroke-linecap="round" filter="url(#glow)" />
  <!-- Fastfetch mini logo element -->
  <text x="350" y="210" fill="#89dceb" font-family="monospace" font-weight="bold" font-size="72">FF</text>
</svg>